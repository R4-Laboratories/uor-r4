[[bin]]
name = "verify-native-occurrence"
path = "src/bin/verify-native-occurrence.rs"

[[bin]]
name = "pack-whole-turn-occurrence"
path = "src/bin/pack-whole-turn-occurrence.rs"
required-features = ["serving-wasm"]

[[bin]]
name = "pack-native-interval"
path = "src/bin/pack-native-interval.rs"
required-features = ["serving-wasm"]

[[bin]]
name = "verify-whole-turn-occurrence"
path = "src/bin/verify-whole-turn-occurrence.rs"

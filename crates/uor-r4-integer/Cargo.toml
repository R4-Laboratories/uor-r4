[package]
name = "uor-r4-integer"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Standalone integer execution of retained UOR-R4 recurrent attention models"
autobins = false

[lib]
path = "src/native_geometry.rs"
# `cdylib` is required for the #1172 WASM module (`serving-wasm`); it adds no
# artifact to the default native qualification build's compile surface.
crate-type = ["rlib", "cdylib"]

[features]
# Compatibility name only: selecting historical executors fails at compile time.
historical-runtime = []
p1-count-serving = ["serving-wasm", "dep:uor-r4-count-runtime"]
chat-client = []
p4-only-client = ["chat-client", "dep:uor-r4-tokenizer", "dep:uor-r4-count-runtime"]
# Read-only replay for the frozen post-period experiment.
postperiod-diagnostic = []
# Cold replay of the two frozen source-choice releases.
release-factorial-diagnostic = []
# Serve the preserved D11 integer/stack runtime to WebAssembly (#1172). The
# native qualification graph never selects this feature; with it, the facade's
# compile_error! stands down and the preserved serving root compiles (see the
# facade gate in src/native_geometry.rs). On wasm32 `dep:rayon` is not pulled:
# the worker pool is a native-only path, cfg'd out there (steps are
# single-threaded; the integers do not depend on threading).
serving-wasm = [
    "chat-client",
    "dep:wasm-bindgen",
    "dep:uor-r4-tokenizer",
    "dep:rayon",
    "dep:uor-r4-vision",
    "dep:uor-r4-native-vector",
]
# The synthetic SpiralCore/FBS controls (`stack::synthetic`) for an evaluator
# outside this crate that must reproduce `step_native` on them (claude-128).
fbs-synthetic = []

[dependencies]
uor-r4-count-runtime = { path = "../uor-r4-discrete/count-runtime", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
sha2 = "0.10.8"
hex = "0.4.3"
blake3 = "=1.5.0"

# The preserved serving root's own dependencies (only needed with
# `serving-wasm`, the feature that compiles it). Optional so the default
# native qualification graph does not link them.
uor-r4-tokenizer = { path = "../uor-r4-tokenizer", optional = true }
uor-r4-vision = { path = "../uor-r4-vision", optional = true }
uor-r4-native-vector = { path = "../uor-r4-native-vector", default-features = false, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Native-only: the stack step's opt-in worker pool (#1691). wasm32 steps are
# single-threaded; the integers do not depend on threading.
rayon = { version = "1.10", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2.92", optional = true }


[[bin]]
name = "activate-s2-expert"
path = "src/bin/activate-s2-expert.rs"

[[bin]]
name = "uor-chat"
path = "src/bin/uor-chat-entry.rs"
required-features = ["chat-client"]

[[bin]]
name = "uor-r4-integer"
path = "src/bin/uor-r4-integer.rs"
required-features = ["serving-wasm"]

[[bin]]
name = "verify-integer"
path = "src/bin/verify-integer.rs"
required-features = ["serving-wasm"]

[[bin]]
name = "uor-r4-stack"
path = "src/bin/uor-r4-stack.rs"
required-features = ["serving-wasm"]

[[bin]]
name = "mk-synthetic-stack"
path = "src/bin/mk-synthetic-stack.rs"
required-features = ["serving-wasm"]

[[bin]]
name = "fbs-export"
path = "src/bin/fbs-export.rs"
required-features = ["serving-wasm"]

[[bin]]
name = "fbs-compare"
path = "src/bin/fbs-compare.rs"
required-features = ["serving-wasm"]

[[bin]]
name = "fbs-toks"
path = "src/bin/fbs-toks.rs"
required-features = ["serving-wasm"]

[[bin]]
name = "place-asks"
path = "src/bin/place-asks.rs"
required-features = ["serving-wasm"]

[[bin]]
name = "pack-all-starts"
path = "src/bin/pack-all-starts.rs"

[[bin]]
name = "pack-contextual-source"
path = "src/bin/pack-contextual-source.rs"

[[bin]]
name = "pack-native-opening"
path = "src/bin/pack-native-opening.rs"

[[bin]]
name = "verify-native-opening"
path = "src/bin/verify-native-opening.rs"

[[bin]]
name = "pack-native-occurrence"
path = "src/bin/pack-native-occurrence.rs"

[package]
name = "fit-native-opening"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[features]
default = []
cuda = ["dep:cudarc"]
fallback = ["cuda","d11/cuda"]

[[bin]]
name = "unchanged-lexical"
path = "src/bin/unchanged-lexical.rs"
required-features = ["fallback"]

[dependencies]
cudarc = { path = "../../../../../../third_party/cudarc-0.19.10", default-features = false, features = ["std","driver","cuda-12080","dynamic-linking"], optional = true }
d11 = { package = "m1-d11-artifact-scorer-instrument", path = "../../../../../labs/m1-d11-artifact-scorer/instrument" }
uor-r4-integer = { path = "../../../../../../crates/uor-r4-integer" }
serde = { version="1", features=["derive"] }
serde_json = "1"
sha2 = "0.10"

[patch.crates-io]
cudarc = { path = "../../../../../../third_party/cudarc-0.19.10" }
arrayref = { path = "../../../../../../third_party/arrayref" }

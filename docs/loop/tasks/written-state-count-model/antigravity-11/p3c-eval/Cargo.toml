[package]
name = "p3c-eval"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[features]
default = []
cuda = ["dep:cudarc", "uor-r4-discrete/cuda"]

[dependencies]
cudarc = { path = "../../../../../../third_party/cudarc-0.19.10", default-features = false, features = ["std", "driver", "cuda-12080", "dynamic-linking"], optional = true }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uor-r4-core = { path = "../../../../../../crates/uor-r4-core" }
uor-r4-count-runtime = { path = "../../../../../../crates/uor-r4-discrete/count-runtime" }
uor-r4-discrete = { path = "../../../../../../crates/uor-r4-discrete" }
uor-r4-integer = { path = "../../../../../../crates/uor-r4-integer" }
uor-r4-tokenizer = { path = "../../../../../../crates/uor-r4-tokenizer" }

[patch.crates-io]
cudarc = { path = "../../../../../../third_party/cudarc-0.19.10" }
arrayref = { path = "../../../../../../third_party/arrayref" }
